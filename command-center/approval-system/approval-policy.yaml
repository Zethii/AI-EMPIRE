# Draft policy. Not enforced by software yet.
version: 1
status: draft
approval_required_for:
  - public_content_publishing
  - external_messages
  - purchases_or_payments
  - destructive_file_or_data_changes
  - production_infrastructure_changes
  - external_sharing_of_private_or_sensitive_information
approval_record_fields:
  - action_summary
  - requester
  - preview_or_payload
  - risk
  - requested_at
  - decision
  - decided_at
policy:
  approvals_must_be_explicit: true
  silence_is_not_approval: true
  approval_is_action_specific: true
  approval_expires_if_action_changes: true
